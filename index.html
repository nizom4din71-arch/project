<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>figma</title>
  </head>
  <body>
    <header>
      <nav>
        <img class="img__logo" src="./logo 2.svg" alt="" />
        <ul class="nav__ul">
          <li class="nav__list">
            <a class="nav__anchor" href="#">home</a>
          </li>
          <li>
            <a class="nav__anchor" href="">NFT Market</a>
          </li>
          <li>
            <a class="nav__anchor" href="#">Shop</a>
          </li>
          <li>
            <a class="nav__anchor" href="#">About Us</a>
          </li>
        </ul>
        <button class="nav__btn">Explore Now</button>
      </nav>
    </header>
    <section>
      <div class="container">
        <div class="card-left">
          <div class="card">
            <h1 class="hero__title">
              Explore The Largest
              <span
                style="
                  background: linear-gradient(
                    123.38deg,
                    #351a88 21.26%,
                    #ff6654 58.34%
                  );
                  background-clip: text;
                  -webkit-background-clip: text;
                  -webkit-text-fill-color: transparent;
                "
                >NFT</span
              >
              Marketplaces
            </h1>
            <p class="hero__text1">Buy, Sell & Trade Cryptocurrency Easily and Securely</p>
            <div>
              <button class="section__btn">Connect Wallet</button>
              <button class="section__btn1">Learn More</button>
            </div>
          </div>
          <div class="about">
            <p>Our Members</p>
            <img src="./avatars.svg" alt="Avatar"> />
          </div>
        </div>
        <div class="card-right">
          <img src="./hero img (1).png" alt="" />
        </div>
      </div>
    </section>
    <section>
      <div class="secure-div">
        <h1>Secure & Private</h1>
        <p>24/7 Decated Support Team</p>
        <div class="cards">
          <img class="card_img" src="./card 1 (1).png" alt="">
          <img class="card_img" src="./card 2.png" alt="">
          <img class="card_img" src="card 3.png" alt="">
        </div>
      </div>
      <div class="card-wrapper">
        <div class="hero">
        <img class="content" src="./content.png" alt="">
        </div>
      <div>
        <img class="card-same" src="./bg same 1 — копия.png" alt="">
      </div>
      </div>
    </section>
    <div>
    </div>
  </body>
</html>
